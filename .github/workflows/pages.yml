# Oyunu GitHub Pages'te yayımlar: https://a-sayan.github.io/soulgate/
# main dalına oyun dosyası gönderildikçe kendiliğinden güncellenir.
name: Web sitesi (GitHub Pages)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - 'media/**'
      - 'tools/**'
      - 'dev/**'
      - 'README.md'
      - 'CLAUDE.md'
      - '.github/release-notes.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Oyun dosyalarını topla
        run: |
          mkdir -p _site
          cp -r index.html style.css manifest.webmanifest sw.js LICENSE js icons fonts _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
